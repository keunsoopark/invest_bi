name: dbt run all

on:
  workflow_dispatch:

jobs:
  run-dbt:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./dbt

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dbt-bigquery
        run: pip install dbt-bigquery

      - name: Install dbt dependencies
        run: dbt deps
      
      - name: Write service account key
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY_FOR_DBT }}' > gcp_key.json

      - name: Run dbt
        run: dbt run --profiles-dir ./profiles
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ./gcp_key.json

      - name: dbt test
        run: dbt test --profiles-dir ./profiles
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ./gcp_key.json

      - name: Notify Slack on failure
        if: ${{ failure() }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          slack-message: |
            ❌ *dbt run all* failed
            • Repo: ${{ github.repository }}
            • Workflow: ${{ github.workflow }} / Job: ${{ github.job }}
            • Run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open logs>
            • Commit: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

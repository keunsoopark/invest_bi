name: dbt Daily Run

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'  # Runs every day at 05:00 UTC

jobs:
  run-dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: cd dbt
      - run: pip install dbt-bigquery
      - run: dbt deps
      - run: dbt run
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY_FOR_DBT }}

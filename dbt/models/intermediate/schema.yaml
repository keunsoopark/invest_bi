version: 2

models:
  - name: int_fx_filled
    description: >
      Daily FX rates with missing dates filled forward via last-known values.
      Materialized incrementally. Use as the canonical FX lookup for any model needing currency conversion.
    columns:
      - name: date
        data_type: date
        description: Calendar date (gap-filled).

      - name: usdnok
        data_type: float64
        description: 1 USD in NOK at `date`.

      - name: nokkrw
        data_type: float64
        description: 1 NOK in KRW at `date`.

  - name: int_transactions_in_nok
    description: >
      Transactions with `price` converted to NOK via daily FX. Original currency preserved as `original_currency`.
      Sentinel: `amounts = 999999` flags an uncountable asset transaction; `price` then carries the monetary
      delta directly (not a unit price). Filter out or branch on `999999` before any SUM/AVG of amounts.
      TODO: convert to incremental.
    columns:
      - name: date
        data_type: date
      - name: asset_name
        data_type: string
      - name: asset_id
        data_type: string
      - name: price
        data_type: float64
        description: Per-unit price in NOK. For uncountable assets (amounts=999999), this is the total transaction value.
      - name: original_currency
        data_type: string
        description: Original currency code before NOK conversion.
      - name: amounts
        data_type: int64
        description: Units transacted. Sentinel `999999` = uncountable.
      - name: strategy_name
        data_type: string
      - name: strategy_details
        data_type: string

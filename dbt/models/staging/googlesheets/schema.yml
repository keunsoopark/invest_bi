version: 2

models:
  - name: stg_transactions
    description: ""
    columns:
      - name: date
        data_type: date
        description: ""

      - name: asset_name
        data_type: string
        description: ""
        tests:
          - dbt_utils.relationships:
              to: ref('stg_assets')
              field: asset_name

      - name: asset_id
        data_type: string
        description: ""

      - name: price
        data_type: float64
        description: ""

      - name: currency
        data_type: string
        description: ""

      - name: amounts
        data_type: int64
        description: ""

      - name: strategy_name
        data_type: string
        description: ""

      - name: strategy_details
        data_type: string
        description: ""

      - name: transaction_version
        data_type: int64
        description: ""

  - name: stg_assets
    description: ""
    columns:
      - name: asset_name
        data_type: string
        description: ""

      - name: asset_id
        data_type: string
        description: ""

      - name: main_group
        data_type: string
        description: ""

      - name: sub_group
        data_type: string
        description: ""

      - name: sector
        data_type: string
        description: ""

      - name: region
        data_type: string
        description: ""

      - name: sub_region
        data_type: string
        description: ""

      - name: currency
        data_type: string
        description: ""

version: 2

models:
  - name: stg_transactions
    description: >
      Raw asset transactions from Google Sheets. `price` is in `currency` (original, not NOK).
      Sentinel: `amounts = 999999` means the asset is uncountable (crypto, cash, balance-only);
      for these rows `price` carries the monetary value directly, not a per-unit price.
      Downstream models (int_transactions_in_nok, fct_*) propagate this sentinel — filter out or
      branch on `999999` before SUM/AVG.
    columns:
      - name: date
        data_type: date
        description: Transaction date.

      - name: asset_name
        data_type: string
        description: Asset name (FK to stg_assets).
        tests:
          - relationships:
              arguments:
                to: ref('stg_assets')
                field: asset_name
      - name: asset_id
        data_type: string

      - name: price
        data_type: float64
        description: Per-unit price in `currency`. For uncountable assets (amounts=999999), this is the total transaction value.

      - name: currency
        data_type: string
        description: Original currency code (USD, NOK, KRW, etc.).

      - name: amounts
        data_type: int64
        description: Units transacted. Sentinel `999999` = uncountable asset; treat as flag, not value.

      - name: strategy_name
        data_type: string

      - name: strategy_details
        data_type: string

      - name: transaction_version
        data_type: int64
        description: Version number for transaction revisions.

  - name: stg_assets
    description: Asset master dimension. One row per asset with classification (group, sector, region) and the asset's native currency.
    columns:
      - name: asset_name
        data_type: string
        description: Asset name (primary key for joins).

      - name: asset_id
        data_type: string
        description: Unique asset identifier (e.g. ticker).

      - name: main_group
        data_type: string
        description: Top-level asset class (e.g. equity, crypto, cash, property).

      - name: sub_group
        data_type: string
        description: Sub-classification under main_group.

      - name: sector
        data_type: string
        description: Sector classification (e.g. tech, energy).

      - name: region
        data_type: string
        description: Geographic region (e.g. US, Europe, Asia).

      - name: sub_region
        data_type: string
        description: Country or sub-region under `region`.

      - name: currency
        data_type: string
        description: Native currency of the asset (USD, NOK, KRW, etc.).

  - name: stg_balance_manual
    description: >
      Manual balance adjustments per (asset_name, date). `balance` is in `currency` (original).
      Used for uncountable assets where unit-level transactions are not tracked.
    columns:
      - name: asset_name
        description: Name of the asset.

      - name: date
        description: Date of the manual balance update.

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - asset_name
              - date